name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux/amd64, darwin/arm64, and windows/amd64 run on the same
          # runners as ci.yml's test job, so they get native `go test` too.
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, native: true }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, native: true }
          # No GOOS=linux GOARCH=arm hosted runner exists; cross-built here
          # and smoke-tested under QEMU below instead of `go test`.
          - { goos: linux, goarch: arm, goarm: "7", runner: ubuntu-latest, native: false }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel, native: true }
          - { goos: darwin, goarch: arm64, runner: macos-latest, native: true }
          - { goos: windows, goarch: amd64, runner: windows-latest, native: true }
          - { goos: windows, goarch: arm64, runner: windows-11-arm, native: true }
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test (native)
        if: matrix.native
        run: go test ./...
        shell: bash

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          name="clean-invisible-text-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}"
          [ "${{ matrix.goos }}" = windows ] && name="$name.exe"
          go build -trimpath -o "dist/$name" ./cmd/clean-invisible-text

      # Signing/notarization only runs for an actual version tag: it needs
      # secrets that only make sense for a real release, and workflow_dispatch
      # is for exercising the build on a branch without publishing anything.
      # See docs/release-process.md for what these secrets are and how to
      # obtain them.
      - name: Import signing certificate
        if: matrix.goos == 'darwin' && startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/release-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "${RUNNER_TEMP}/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046 # intentional word-splitting: adds the
          # new keychain to the user's existing search list, not just one path
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "${RUNNER_TEMP}/certificate.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::no Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi
          {
            echo "CODESIGN_IDENTITY=$IDENTITY"
            echo "RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Import notarization API key
        if: matrix.goos == 'darwin' && startsWith(github.ref, 'refs/tags/')
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          KEY_PATH="${RUNNER_TEMP}/notary-key.p8"
          printf '%s' "$NOTARY_API_KEY" | base64 --decode > "$KEY_PATH"
          {
            echo "NOTARY_API_KEY_PATH=$KEY_PATH"
            echo "NOTARY_KEY_ID=${{ secrets.NOTARY_KEY_ID }}"
            echo "NOTARY_ISSUER_ID=${{ secrets.NOTARY_ISSUER_ID }}"
          } >> "$GITHUB_ENV"

      - name: Sign and notarize (darwin)
        if: matrix.goos == 'darwin' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          binary="dist/clean-invisible-text-${{ matrix.goos }}-${{ matrix.goarch }}"
          codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          scripts/notarize-binary.sh "$binary"

      - name: Clean up signing credentials
        if: always() && matrix.goos == 'darwin'
        run: |
          if [ -n "${RELEASE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH"
          fi
          rm -f "${NOTARY_API_KEY_PATH:-}"

      - name: Set up QEMU (arm/v7 smoke test)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm' && matrix.goarm == '7'
        # QEMU runs privileged while registering binfmt handlers, so pin both
        # the action and its installer image to immutable revisions.
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm

      - name: Smoke test under QEMU (arm/v7)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm' && matrix.goarm == '7'
        run: |
          docker run --rm --platform linux/arm/v7 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/dist:/dist:ro" -w /dist \
            debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 \
            ./clean-invisible-text-linux-armv7 --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/*

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum clean-invisible-text-* > checksums.txt

      # Only on an actual version tag: workflow_dispatch from a branch is
      # for exercising the build matrix without publishing anything.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/clean-invisible-text-*"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
